name: Scrape NOAA & IPHC Ocean Harvest

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json
      - name: Install dependencies
        working-directory: scraper
        run: npm ci
      - name: Run ocean harvest scraper
        working-directory: scraper
        run: npx tsx src/scrape-ocean.ts
      - name: Commit if changed
        run: |
          git config user.name "AlaskaFishData Bot"
          git config user.email "bot@alaskafishdata.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "data: ocean harvest update $(date -u +%Y-%m-%dT%H:%M:%SZ) [auto]"
            git push
          fi
